<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112826"><title>LittleRip Chat</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main id="gate"><div class="mark" aria-hidden="true">lr.</div><small>LITTLERIP / PRIVATE SERVER</small><h1>LittleRip Chat</h1><p>A place for your people to talk, one channel at a time.</p><form id="login"><label for="code">One-time invite code</label><input id="code" type="password" required autocomplete="off" spellcheck="false" placeholder="Paste your code"><button>Join the server →</button></form><p id="loginmsg" role="status">Ask the host for a code to get in.</p></main>
<main id="room" hidden><aside><small>LITTLERIP / SERVER</small><h2>Channels</h2><nav aria-label="Channels" id="channels"></nav><footer><b id="who"></b> <button id="out">Sign out</button></footer></aside><section><header><small>TEXT CHANNEL</small><h2 id="title"></h2></header><div id="history" aria-label="Channel history"></div><form id="compose"><label for="message">Message</label><textarea required id="message" rows="2" maxlength="2000"></textarea><button>Send</button></form><div id="status" role="status"></div></section></main></body></html>
